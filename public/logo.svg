<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Gift box icon (representing free items) -->
  <g transform="translate(100, 100)">
    <!-- Box -->
    <rect x="20" y="60" width="120" height="100" fill="none" stroke="url(#textGradient)" stroke-width="4" rx="8"/>

    <!-- Lid -->
    <path d="M 30 60 L 80 20 L 130 60" fill="none" stroke="url(#textGradient)" stroke-width="4" stroke-linejoin="round"/>
    <line x1="80" y1="20" x2="80" y2="60" stroke="url(#textGradient)" stroke-width="4"/>

    <!-- Ribbon -->
    <circle cx="80" cy="60" r="8" fill="url(#textGradient)"/>
  </g>

  <!-- Text "FreeFy" -->
  <text
    x="256"
    y="320"
    font-family="Inter, system-ui, sans-serif"
    font-size="84"
    font-weight="800"
    fill="url(#textGradient)"
    text-anchor="middle"
    letter-spacing="-2"
  >
    FreeFy
  </text>

  <!-- Tagline -->
  <text
    x="256"
    y="370"
    font-family="Inter, system-ui, sans-serif"
    font-size="20"
    fill="#64748B"
    text-anchor="middle"
  >
    Objetos gratis en Madrid
  </text>
</svg>
